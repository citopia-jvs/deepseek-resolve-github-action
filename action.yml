name: "DeepSeek Auto-Resolve Issue"
description: "Résout une issue mentionnant @ag-resolve avec Claude Code, branché sur un modèle Scaleway"
author: "Fabien Sanchez"

inputs:
  scaleway-api-key:
    description: "Clé d'API Scaleway Generative APIs. À passer par un secret, jamais en clair."
    required: true
  scaleway-base-url:
    description: "URL de l'API Scaleway compatible OpenAI, de la forme https://api.scaleway.ai/<id-projet>/v1."
    required: false
    default: "https://api.scaleway.ai/v1"
  model:
    description: "Modèle Scaleway utilisé pour toutes les requêtes."
    required: false
    default: "glm-5.3"
  context-window:
    # Claude Code ne connaît pas la fenêtre d'un modèle non-Claude et suppose
    # 200 000 tokens : sans cette valeur, il compacterait au mauvais moment.
    description: "Fenêtre de contexte du modèle, en tokens."
    required: false
    default: "256000"
  max-turns:
    description: "Nombre maximum de tours de Claude Code par passage."
    required: false
    default: "30"
  github-token:
    description: "Jeton GitHub utilisé pour pousser la branche, ouvrir la PR et commenter."
    required: false
    default: ${{ github.token }}
  validation-command:
    description: "Commande exécutée dans le dépôt appelant pour valider la correction."
    required: false
    default: "npm test"
  base-branch:
    description: "Branche de base de la pull request. Vide : la branche du checkout."
    required: false
    default: ""
  allowed-associations:
    description: "Associations au dépôt autorisées à déclencher l'action, séparées par des virgules."
    required: false
    default: "OWNER,MEMBER,COLLABORATOR"
  require-trusted-issue-author:
    description: "Exiger que l'auteur de l'issue soit lui aussi de confiance pour prendre son corps comme consigne."
    required: false
    default: "true"

outputs:
  poursuivre:
    description: "« true » si la garde a autorisé l'exécution, « false » sinon."
    value: ${{ steps.garde.outputs.poursuivre }}
  branche:
    description: "Nom de la branche de travail, de la forme fix-issue-<n>."
    value: ${{ steps.garde.outputs.branche }}
  numero-pr:
    description: "Numéro de la pull request, vide si aucune n'a été ouverte."
    value: ${{ steps.preparer.outputs.numero-pr }}
  succes:
    description: "« true » uniquement si la validation est passée et le travail poussé."
    value: ${{ steps.conclure.outputs.succes }}

runs:
  using: composite
  steps:
    # Les inputs d'une composite action ne sont PAS exposés en `INPUT_*` : toute
    # valeur lue par un script figure dans le `env:` de son step. Les scripts sont
    # appelés via `$GITHUB_ACTION_PATH`, jamais par un chemin relatif.
    - id: garde
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ASSOCIATIONS_AUTORISEES: ${{ inputs.allowed-associations }}
        EXIGER_AUTEUR_ISSUE_DE_CONFIANCE: ${{ inputs.require-trusted-issue-author }}
      run: node "$GITHUB_ACTION_PATH/scripts/garde.js"

    # Branche, commit vide, PR brouillon, consigne. Avant claude-code-action, qui
    # ne fait rien de tout ça en mode agent.
    - id: preparer
      if: steps.garde.outputs.poursuivre == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NUMERO_ISSUE: ${{ steps.garde.outputs.issue }}
        BRANCHE: ${{ steps.garde.outputs.branche }}
        BRANCHE_BASE: ${{ inputs.base-branch }}
        COMMANDE_VALIDATION: ${{ inputs.validation-command }}
        CONSIGNE_RESTREINTE: ${{ steps.garde.outputs.consigne-restreinte }}
      run: node "$GITHUB_ACTION_PATH/scripts/preparer.js"

    # Proxy Anthropic → OpenAI vers Scaleway, en tâche de fond pour le reste du
    # job. La clé passe par un fichier supprimé dès le démarrage, et `env -u` la
    # retire de l'environnement du proxy, lisible dans /proc par tout processus
    # du même utilisateur.
    - id: proxy
      if: steps.preparer.outcome == 'success'
      shell: bash
      env:
        SCW_SECRET_KEY: ${{ inputs.scaleway-api-key }}
        SCW_MODELE: ${{ inputs.model }}
        SCW_BASE_URL: ${{ inputs.scaleway-base-url }}
      run: |
        cle="$(mktemp)"
        chmod 600 "$cle"
        printf '%s' "$SCW_SECRET_KEY" > "$cle"
        jeton="$(node -e 'process.stdout.write(require("crypto").randomBytes(24).toString("hex"))')"
        echo "::add-mask::$jeton"
        SCW_CLE_FICHIER="$cle" PROXY_JETON="$jeton" PROXY_PORT=0 \
          nohup env -u SCW_SECRET_KEY node "$GITHUB_ACTION_PATH/scripts/proxy.js" \
          > "$RUNNER_TEMP/dsr-proxy.port" 2> "$RUNNER_TEMP/dsr-proxy.log" &
        port=''
        for _ in $(seq 1 50); do
          port="$(sed -n 's/^PORT=//p' "$RUNNER_TEMP/dsr-proxy.port")"
          if [ -n "$port" ]; then break; fi
          sleep 0.2
        done
        rm -f "$cle"
        if [ -z "$port" ]; then
          echo "::error::Le proxy n'a pas démarré."
          cat "$RUNNER_TEMP/dsr-proxy.log"
          exit 1
        fi
        echo "ANTHROPIC_BASE_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
        echo "jeton=$jeton" >> "$GITHUB_OUTPUT"

    # Claude Code n'a PAS Bash : claude-code-action lui transmet le jeton GitHub
    # dans son environnement, et tout code qu'il exécuterait — un test qu'il vient
    # d'écrire — pourrait le lire. Il lit et édite ; les tests sont lancés par
    # `verifier.js`, sans le jeton.
    - id: claude1
      if: steps.proxy.outcome == 'success'
      # v1.0.258, épinglée par SHA : voir « Versions épinglées » dans plan/contrat.md.
      uses: anthropics/claude-code-action@6b6870e649b5ff408753befeaee5fc7989d4e6a9
      with:
        prompt: ${{ steps.preparer.outputs.consigne }}
        anthropic_api_key: ${{ steps.proxy.outputs.jeton }}
        github_token: ${{ inputs.github-token }}
        settings: |
          {
            "env": {
              "ANTHROPIC_MODEL": "${{ inputs.model }}",
              "ANTHROPIC_DEFAULT_OPUS_MODEL": "${{ inputs.model }}",
              "ANTHROPIC_DEFAULT_SONNET_MODEL": "${{ inputs.model }}",
              "ANTHROPIC_DEFAULT_HAIKU_MODEL": "${{ inputs.model }}",
              "CLAUDE_CODE_MAX_CONTEXT_TOKENS": "${{ inputs.context-window }}",
              "CLAUDE_CODE_MAX_OUTPUT_TOKENS": "16384",
              "CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS": "1"
            },
            "permissions": {
              "deny": ["Read(./.git/**)", "Edit(./.git/**)", "Write(./.git/**)"]
            }
          }
        claude_args: >-
          --model ${{ inputs.model }}
          --max-turns ${{ inputs.max-turns }}
          --allowedTools "Read,Edit,Write,Glob,Grep"
          --disallowedTools "Bash,WebFetch,WebSearch"

    - id: verifier1
      if: always() && steps.claude1.outcome != 'skipped'
      shell: bash
      env:
        COMMANDE_VALIDATION: ${{ inputs.validation-command }}
        SAUVEGARDE_CONFIG: ${{ steps.preparer.outputs.sauvegarde-config }}
        CONSIGNE: ${{ steps.preparer.outputs.consigne }}
        PASSAGE: "1"
      run: node "$GITHUB_ACTION_PATH/scripts/verifier.js"

    # Seconde chance : les tests ont échoué, le modèle reçoit leur sortie.
    - id: claude2
      if: always() && steps.verifier1.outputs.succes == 'false'
      # v1.0.258, épinglée par SHA : voir « Versions épinglées » dans plan/contrat.md.
      uses: anthropics/claude-code-action@6b6870e649b5ff408753befeaee5fc7989d4e6a9
      with:
        prompt: ${{ steps.verifier1.outputs.consigne-reprise }}
        anthropic_api_key: ${{ steps.proxy.outputs.jeton }}
        github_token: ${{ inputs.github-token }}
        settings: |
          {
            "env": {
              "ANTHROPIC_MODEL": "${{ inputs.model }}",
              "ANTHROPIC_DEFAULT_OPUS_MODEL": "${{ inputs.model }}",
              "ANTHROPIC_DEFAULT_SONNET_MODEL": "${{ inputs.model }}",
              "ANTHROPIC_DEFAULT_HAIKU_MODEL": "${{ inputs.model }}",
              "CLAUDE_CODE_MAX_CONTEXT_TOKENS": "${{ inputs.context-window }}",
              "CLAUDE_CODE_MAX_OUTPUT_TOKENS": "16384",
              "CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS": "1"
            },
            "permissions": {
              "deny": ["Read(./.git/**)", "Edit(./.git/**)", "Write(./.git/**)"]
            }
          }
        claude_args: >-
          --model ${{ inputs.model }}
          --max-turns ${{ inputs.max-turns }}
          --allowedTools "Read,Edit,Write,Glob,Grep"
          --disallowedTools "Bash,WebFetch,WebSearch"

    - id: verifier2
      if: always() && steps.claude2.outcome != 'skipped'
      shell: bash
      env:
        COMMANDE_VALIDATION: ${{ inputs.validation-command }}
        SAUVEGARDE_CONFIG: ${{ steps.preparer.outputs.sauvegarde-config }}
        CONSIGNE: ${{ steps.preparer.outputs.consigne }}
        PASSAGE: "2"
      run: node "$GITHUB_ACTION_PATH/scripts/verifier.js"

    - id: conclure
      if: always() && steps.preparer.outputs.numero-pr != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NUMERO_ISSUE: ${{ steps.garde.outputs.issue }}
        NUMERO_PR: ${{ steps.preparer.outputs.numero-pr }}
        BRANCHE: ${{ steps.garde.outputs.branche }}
        SAUVEGARDE_CONFIG: ${{ steps.preparer.outputs.sauvegarde-config }}
        SUCCES: ${{ steps.claude2.outcome != 'skipped' && steps.verifier2.outputs.succes || steps.verifier1.outputs.succes }}
        PASSAGES: ${{ steps.claude2.outcome != 'skipped' && '2' || '1' }}
        ISSUE_CLAUDE: ${{ steps.claude2.outcome != 'skipped' && steps.claude2.outcome || steps.claude1.outcome }}
        EXTRAIT: ${{ steps.claude2.outcome != 'skipped' && steps.verifier2.outputs.extrait || steps.verifier1.outputs.extrait }}
        FICHIER_EXECUTION: ${{ steps.claude2.outcome != 'skipped' && steps.claude2.outputs.execution_file || steps.claude1.outputs.execution_file }}
        RELECTEUR: ${{ github.actor }}
      run: node "$GITHUB_ACTION_PATH/scripts/conclure.js"

branding:
  icon: "cpu"
  color: "blue"
